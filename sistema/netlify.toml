# =============================================================
# KIOSCO SYSTEM - NETLIFY.TOML
# Configuracion de build y variables de entorno para Netlify
# =============================================================

[build]
  # Netlify no necesita comando de build para sitios estaticos puros.
  # Si en el futuro agregas un bundler (Vite, Parcel) va aqui.
  publish = "."

# 1. Headers de seguridad globales para todas las paginas
[[headers]]
  for = "/*"
  [headers.values]
    # Evita que el sitio sea embebido en iframes de otros dominios
    X-Frame-Options = "DENY"
    # Evita sniffing de tipo de contenido
    X-Content-Type-Options = "nosniff"
    # Politica de referencia
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Fuerza HTTPS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Politica de permisos (deshabilita APIs no usadas)
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Por defecto, forzamos revalidación suave en la raíz
    Cache-Control = "public, max-age=0, must-revalidate"

# 2. Control estricto de caché para evitar que el index se quede pegado
[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

# Las pantallas internas no se indexan; login.html si. Netlify tambien las sirve sin .html
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pos"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pos.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"

# Politica de seguridad de contenido, ruta por ruta: solo se carga codigo del propio sitio y las
# conexiones salen unicamente hacia Supabase. Se mantiene 'unsafe-inline' porque el sistema usa
# scripts y estilos en linea (onclick, style=). Fuentes: Google Fonts.
# No va en /* porque /presentacion necesita otra politica: si Netlify sumara las dos, el navegador
# aplicaria ambas y bloquearia el reproductor. Las rutas desconocidas reciben index.html, que la
# lleva en una meta: si cambia aca, hay que cambiarla tambien alla.
[[headers]]
  for = "/login"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/login.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# La presentacion es la unica pagina que puede cargar el reproductor de YouTube
[[headers]]
  for = "/presentacion"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; frame-src https://www.youtube-nocookie.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/presentacion.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; frame-src https://www.youtube-nocookie.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# 3. Cache agresivo para assets estaticos (Esto está perfecto porque tienen nombres/rutas fijas)
# Cache controlado para assets estaticos (Eliminamos 'immutable' y bajamos el tiempo)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirigir cualquier ruta desconocida al index (SPA-like)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200